# Intégration continue : les deux suites de tests hors base, la démo bout en bout, puis les deux notebooks de parcours
# (01_preparation_donnees.Rmd, 02_campagne.Rmd) déroulés en mode démo DE HAUT EN BAS (demo/executer_notebook.R : chunks
# exécutés dans l'ordre, sans rmarkdown) — la promesse « un notebook = un parcours, tout s'exécute dans l'ordre » est
# TESTÉE à chaque push, pas déclarée. 03_outils_maintenance.Rmd est hors démo (outils d'exception, eval=FALSE).
# Le job échoue dès qu'une étape échoue (les suites et la démo terminent par stop() en cas d'échec :
# Rscript rend alors un code non nul). Si la suite SQLite ou la démo dépasse les runners (temps ou
# RAM ~7 Go), la scinder en job séparé sur push main seulement — sans réduire les fixtures.
name: tests
on:
  push:
  pull_request:
# Deux jobs (matrice) : AVEC arrow réel et SANS arrow (repli mock RDS, arrow partiel sans datasets) — les deux
# enchaînent les deux suites, la démo et les deux notebooks : le chemin de repli est exercé à chaque push
# (lot « correctifs post-contrôle » : un appel direct à arrow::open_dataset dans un notebook avait échappé).
jobs:
  tests:
    name: tests (${{ matrix.arrow }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arrow: [avec-arrow, sans-arrow]
    env:
      R_KEEP_PKG_SOURCE: no
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dépendances R (binaires RSPM ; arrow selon la matrice)
        run: |
          pkgs <- c("dplyr", "dbplyr", "purrr", "tidyr", "stringr", "tibble", "yaml", "DBI", "RSQLite", "readr", "openssl")
          avec_arrow <- identical("${{ matrix.arrow }}", "avec-arrow")
          install.packages(c(pkgs, if(avec_arrow) "arrow"), Ncpus = 2)
          for(p in pkgs) if(!requireNamespace(p, quietly = TRUE)) stop("Paquet manquant : ", p)
          if(avec_arrow && !requireNamespace("arrow", quietly = TRUE)) stop("arrow attendu (matrice avec-arrow) et absent")
          if(!avec_arrow && requireNamespace("arrow", quietly = TRUE)) stop("arrow présent alors que la matrice est sans-arrow")
          cat("arrow :", requireNamespace("arrow", quietly = TRUE), "\n")   # sans arrow : repli mock RDS dans tests, démo et notebooks
        shell: Rscript {0}
      - name: Tests des helpers purs
        run: Rscript tests/test_helpers.R
      - name: Tests des scripts réels sur SQLite (mock pRatihque)
        run: Rscript tests/test_chaines_sqlite.R
      - name: Démo — base fictive
        run: Rscript demo/creer_base_demo.R
      - name: Démo — pipeline complet
        run: Rscript demo/lancer_demo.R
      - name: Notebook 01 en mode démo, de haut en bas — préparer les données
        run: Rscript demo/executer_notebook.R --raz 01_preparation_donnees.Rmd
      - name: Notebook 02 en mode démo, de haut en bas — produire une campagne
        run: Rscript demo/executer_notebook.R 02_campagne.Rmd
